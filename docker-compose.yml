services:
  # ── Database MySQL ─────────────────────────────────
  db:
    image: mysql:8.0
    container_name: agroadvisor-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password123}
      MYSQL_DATABASE: ${DB_NAME:-agroadvisor}
    ports:
      - "3310:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Ollama (Local LLM Fallback) ────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: agroadvisor-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s
    # Untuk GPU NVIDIA (uncomment jika tersedia):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ── Auto-pull model Ollama saat startup ─────────────
  ollama-init:
    image: ollama/ollama:latest
    container_name: agroadvisor-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    entrypoint: ["ollama", "pull", "qwen2.5:7b"]
    environment:
      - OLLAMA_HOST=http://ollama:11434

  # ── Backend (FastAPI + Uvicorn) ────────────────────
  backend:
    build:
      context: ./Backend - AgroAdvisor
      dockerfile: Dockerfile
    container_name: agroadvisor-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - ./Backend - AgroAdvisor/.env
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    command: >
      sh -c "python -c 'from app.database import init_db; init_db()' &&
             python app/scripts/seed_crops.py &&
             python app/scripts/seed_pests.py &&
             uvicorn main:app --host 0.0.0.0 --port 8001"

  # ── Frontend (Next.js) ─────────────────────────────
  frontend:
    build:
      context: ./Frontend - AgroAdvisor
      dockerfile: Dockerfile
    container_name: agroadvisor-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
  ollama_data:
