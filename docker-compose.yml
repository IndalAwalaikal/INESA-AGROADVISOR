services:
  # ── Database MySQL ─────────────────────────────────
  db:
    image: mysql:8.0
    container_name: agroadvisor-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password123}
      MYSQL_DATABASE: ${DB_NAME:-agroadvisor}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (FastAPI + Uvicorn) ────────────────────
  backend:
    build:
      context: ./Backend - AgroAdvisor
      dockerfile: Dockerfile
    container_name: agroadvisor-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - ./Backend - AgroAdvisor/.env
    environment:
      - DB_HOST=db
      - DB_PORT=3306
    depends_on:
      db:
        condition: service_healthy

  # ── Frontend (Next.js) ─────────────────────────────
  frontend:
    build:
      context: ./Frontend - AgroAdvisor
      dockerfile: Dockerfile
    container_name: agroadvisor-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
